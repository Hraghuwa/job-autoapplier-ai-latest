# Pinned + hashed deps only stay safe if they get bumped: weekly update PRs.
version: 2
updates:
  - package-ecosystem: pip
    directories: ["/", "/backend"]
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
