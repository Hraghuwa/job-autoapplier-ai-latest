<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      width: 250px;
      padding: 15px;
      background-color: #f8f9fa;
      color: #333;
      margin: 0;
    }
    h2 {
      margin-top: 0;
      font-size: 16px;
      color: #202124;
      border-bottom: 1px solid #dadce0;
      padding-bottom: 10px;
    }
    button {
      background-color: #0d6efd;
      color: white;
      border: none;
      padding: 10px 15px;
      border-radius: 6px;
      cursor: pointer;
      width: 100%;
      font-size: 14px;
      font-weight: 500;
      transition: background-color 0.2s;
    }
    button:hover {
      background-color: #0b5ed7;
    }
    button:active {
      background-color: #0a58ca;
    }
    #status {
      margin-top: 10px;
      font-size: 12px;
      color: #6c757d;
      text-align: center;
      min-height: 15px;
    }
    .check {
      color: #198754;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <h2>🚀 Auto-Applier</h2>
  <button id="fillBtn">Autofill Form</button>
  <div id="status">Ready.</div>
  <script src="popup.js"></script>
</body>
</html>
